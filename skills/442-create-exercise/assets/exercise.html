<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="description" content="INFO 442 practice exercise. Answer first, then check." />
<title>Practice exercise</title>
<style>
/* ------------------------------------------------------------------
   Design tokens vendored from skills/442-brand/tokens.css (INFO 442
   brand). This is a mirror kept inline so the page stays a single
   self-contained file. Change a value in 442-brand/tokens.css and in
   442-brand/STYLE.md first, then re-copy it here.
   ------------------------------------------------------------------ */
:root {
  /* Brand - use as marks, not as fields. */
  --uw-purple:      #4B2E83;
  --uw-purple-deep: #351F63;
  --uw-gold:        #B7A57A;
  --uw-gold-deep:   #85754D;

  /* Neutrals - the actual surface. */
  --bg:       #F7F7FB;
  --surface:  #FFFFFF;
  --surface-2:#EDEDF4;
  --ink:      #16151D;
  --ink-2:    #3C3B4A;
  --muted:    #6B6A7B;
  --border:   #DADAE4;

  /* One accent carries interaction. */
  --accent:      #6C4AB6;
  --accent-ink:  #FFFFFF;
  --accent-soft: #EDE7FB;

  /* Semantic state - reserve for real state, never decoration. */
  --success: #1F7A5C;
  --success-soft: #E2F3EC;
  --warning: #9A6414;
  --warning-soft: #FBEEDA;
  --error:   #A32B32;
  --error-soft: #FBE6E7;
  --info:    #2F5F96;
  --info-soft: #E6EEF8;

  /* Type */
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.375rem;
  --text-2xl: 1.75rem;
  --text-3xl: 2.25rem;
  --leading: 1.55;
  --leading-tight: 1.2;

  /* Space - 4 px base */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-12: 3rem;

  --radius: 10px;
  --radius-sm: 6px;
  --radius-pill: 999px;
  --shadow-1: 0 1px 2px rgba(22, 21, 29, 0.06), 0 1px 3px rgba(22, 21, 29, 0.08);
  --shadow-2: 0 6px 16px rgba(22, 21, 29, 0.10);
  --tap: 44px;

  --motion: 160ms;
  --ease: cubic-bezier(0.2, 0, 0, 1);
}

@media (prefers-reduced-motion: reduce) {
  :root { --motion: 1ms; }
}

/* Dark surface, opt-in with <html data-theme="dark">. */
[data-theme="dark"] {
  --bg:       #0F0E15;
  --surface:  #1A1822;
  --surface-2:#242230;
  --ink:      #F2F1F7;
  --ink-2:    #C9C7D6;
  --muted:    #9A98AC;
  --border:   #302E3C;
  --accent:      #9B7BE0;
  --accent-ink:  #14121B;
  --accent-soft: #2A2340;
  --uw-purple: #8A6FC7;
  --uw-gold:   #D2C49B;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: var(--leading);
  -webkit-text-size-adjust: 100%;
}

@media (prefers-reduced-motion: no-preference) {
  a, button { transition: color var(--motion) var(--ease), background var(--motion) var(--ease); }
}

/* ------------------------------------------------------------------
   Exercise layout. Mobile first: one 360 px column, vertical only.
   ------------------------------------------------------------------ */
.wrap {
  max-width: 34rem;
  margin: 0 auto;
  padding: var(--space-6) var(--space-4) var(--space-12);
  padding-bottom: calc(var(--space-12) + env(safe-area-inset-bottom));
}

.top { padding-bottom: var(--space-4); }

h1 {
  margin: 0;
  font-size: var(--text-2xl);
  line-height: var(--leading-tight);
  letter-spacing: -0.01em;
  overflow-wrap: anywhere;
}

/* The UW purple mark: a short rule under the title, never a field. */
h1::after {
  content: "";
  display: block;
  width: 2.5rem;
  height: 3px;
  margin-top: var(--space-3);
  background: var(--uw-purple);
  border-radius: var(--radius-pill);
}

.goal {
  margin: var(--space-4) 0 0;
  color: var(--ink-2);
  font-size: var(--text-lg);
  overflow-wrap: anywhere;
}

.card {
  margin-top: var(--space-6);
  padding: var(--space-6) var(--space-4);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-1);
}

.progress { margin-bottom: var(--space-4); }

.progress-label {
  display: flex;
  justify-content: space-between;
  gap: var(--space-3);
  color: var(--muted);
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.bar {
  height: 6px;
  margin-top: var(--space-2);
  background: var(--surface-2);
  border-radius: var(--radius-pill);
  overflow: hidden;
}

.bar-fill {
  width: 0;
  height: 100%;
  background: var(--accent);
  border-radius: var(--radius-pill);
  transition: width var(--motion) var(--ease);
}

.prompt {
  margin: 0 0 var(--space-6);
  font-size: var(--text-xl);
  line-height: var(--leading-tight);
  font-weight: 600;
  overflow-wrap: anywhere;
}

.prompt:focus { outline: none; }

/* ---- figure: a visual above the prompt ---------------------------- */

.fig { margin: 0 0 var(--space-6); padding: 0; }

.fig-body { display: block; }
.fig-body > svg,
.fig-body > img { display: block; max-width: 100%; height: auto; margin: 0 auto; }

.fig-cap {
  margin: var(--space-2) 0 0;
  color: var(--muted);
  font-size: var(--text-xs);
  text-align: center;
}

/* Code figures and any author supplied <pre> wrap, so a long line never
   makes the page scroll sideways on a phone. */
.fig-code,
.fig-body pre {
  margin: 0;
  padding: var(--space-3) var(--space-4);
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.fig-code code,
.fig-body pre code { font-family: var(--font-mono); font-size: var(--text-sm); }

/* A figure element with data-reveal: tap or hover to show one caption. */
.reveal { cursor: pointer; }
.reveal:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.reveal-on { outline: 2px solid var(--accent); outline-offset: 2px; }

.reveals { margin-top: var(--space-3); }

.reveal-cap {
  margin: 0 0 var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: var(--accent-soft);
  border-left: 3px solid var(--accent);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  color: var(--ink);
  font-size: var(--text-sm);
}

.reveal-cap:last-child { margin-bottom: 0; }

/* ---- widget: an interactive play area ----------------------------- */

.widget {
  margin: 0 0 var(--space-6);
  padding: var(--space-4);
  background: var(--surface-2);
  border-radius: var(--radius);
}

.play { min-height: var(--space-8); }
.play > * { max-width: 100%; }
.play svg, .play img { max-width: 100%; height: auto; }
.play p { margin: 0 0 var(--space-2); overflow-wrap: anywhere; }
.play p:last-child { margin-bottom: 0; }

.controls { display: grid; gap: var(--space-3); margin-top: var(--space-4); }

.ctl { display: grid; gap: var(--space-2); }

.ctl-lbl { color: var(--ink-2); font-size: var(--text-sm); font-weight: 600; }

.ctl-row { display: flex; align-items: center; gap: var(--space-3); }

.rng {
  flex: 1 1 auto;
  min-width: 0;
  min-height: var(--tap);
  accent-color: var(--accent);
}

.ctl-out {
  flex: none;
  min-width: 3.5rem;
  text-align: right;
  color: var(--ink-2);
  font-family: var(--font-mono);
  font-size: var(--text-sm);
}

.ctl-switch {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: var(--tap);
  cursor: pointer;
}

.sw { flex: none; width: 1.4rem; height: 1.4rem; accent-color: var(--accent); }

.sel {
  width: 100%;
  min-height: var(--tap);
  padding: var(--space-2) var(--space-3);
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font: inherit;
  font-size: var(--text-base);
}

.widget-cap { margin: var(--space-3) 0 0; color: var(--muted); font-size: var(--text-xs); }

/* ---- answers ------------------------------------------------------ */

.answer { margin-top: var(--space-3); }

.opts { display: grid; gap: var(--space-3); }

.opt {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  width: 100%;
  min-height: var(--tap);
  padding: var(--space-3) var(--space-4);
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font: inherit;
  font-size: var(--text-base);
  line-height: var(--leading);
  text-align: left;
  cursor: pointer;
}

.opt:hover:not(:disabled) { border-color: var(--accent); }

.opt:disabled { cursor: default; }

.opt-key {
  flex: none;
  width: 1.5rem;
  height: 1.5rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--ink-2);
  font-size: var(--text-sm);
  font-weight: 600;
  line-height: 1.4rem;
  text-align: center;
}

.opt-text { overflow-wrap: anywhere; }

.opt-mark {
  display: block;
  margin-top: var(--space-1);
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

.opt[data-picked="yes"] { background: var(--accent-soft); border-color: var(--accent); }
.opt[data-picked="yes"] .opt-key { border-color: var(--accent); color: var(--accent); }

.opt[data-state="right"] {
  background: var(--success-soft);
  border-color: var(--success);
  border-width: 2px;
  padding: calc(var(--space-3) - 1px) calc(var(--space-4) - 1px);
}
.opt[data-state="right"] .opt-mark { color: var(--success); }
.opt[data-state="right"] .opt-key { border-color: var(--success); color: var(--success); }

.opt[data-state="wrong"] {
  background: var(--error-soft);
  border-color: var(--error);
  border-width: 2px;
  padding: calc(var(--space-3) - 1px) calc(var(--space-4) - 1px);
}
.opt[data-state="wrong"] .opt-mark { color: var(--error); }
.opt[data-state="wrong"] .opt-key { border-color: var(--error); color: var(--error); }

.opt[data-state="muted"] { opacity: 1; color: var(--muted); }
.opt[data-state="muted"] .opt-key { color: var(--muted); }

/* order: the pool is the same as .opts, the picks stack above it */
.chips { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--space-2); }

.chip {
  display: flex;
  align-items: flex-start;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: var(--text-base);
}

.chip-n { flex: none; color: var(--ink-2); font-weight: 600; }
.chip[data-state="right"] { background: var(--success-soft); border-color: var(--success); }
.chip[data-state="wrong"] { background: var(--error-soft); border-color: var(--error); }
.chip[data-state="right"] .opt-mark { color: var(--success); }
.chip[data-state="wrong"] .opt-mark { color: var(--error); }

.lbl {
  margin: var(--space-4) 0 var(--space-2);
  color: var(--ink-2);
  font-size: var(--text-sm);
  font-weight: 600;
}

.lbl:first-child { margin-top: 0; }

/* sort and match: one row per item, a button per bucket or partner */
.assign { display: grid; gap: var(--space-3); }

.arow {
  padding: var(--space-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}

.arow[data-state="right"] { border-color: var(--success); background: var(--success-soft); }
.arow[data-state="wrong"] { border-color: var(--error); background: var(--error-soft); }
.arow[data-state="right"] .opt-mark { color: var(--success); }
.arow[data-state="wrong"] .opt-mark { color: var(--error); }

.atext { margin: 0 0 var(--space-2); font-weight: 600; overflow-wrap: anywhere; }

.abtns { display: flex; flex-wrap: wrap; gap: var(--space-2); }

.abtn {
  min-height: var(--tap);
  padding: var(--space-2) var(--space-3);
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font: inherit;
  font-size: var(--text-sm);
  line-height: var(--leading);
  text-align: left;
  cursor: pointer;
  overflow-wrap: anywhere;
}

.abtn:hover:not(:disabled) { border-color: var(--accent); }
.abtn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
.abtn:disabled { cursor: default; }
.abtn[data-state="right"] { background: var(--success-soft); border-color: var(--success); }
.abtn[data-state="wrong"] { background: var(--error-soft); border-color: var(--error); }
.abtn[data-state="muted"] { color: var(--muted); }

.short { display: grid; gap: var(--space-2); }

.inp {
  width: 100%;
  min-height: var(--tap);
  padding: var(--space-3) var(--space-4);
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font: inherit;
  font-size: var(--text-base);
}

.inp:focus-visible { border-color: var(--accent); }

.btn {
  min-height: var(--tap);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font: inherit;
  font-size: var(--text-base);
  font-weight: 600;
  cursor: pointer;
}

.btn:disabled { opacity: 0.5; cursor: default; }

.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--uw-purple); }

.btn-quiet {
  background: transparent;
  color: var(--ink);
  border-color: var(--border);
}
.btn-quiet:hover { border-color: var(--ink-2); }

.btn-row {
  display: grid;
  gap: var(--space-3);
  margin-top: var(--space-6);
}

.hint-btn { margin-top: var(--space-4); }
.hint {
  margin: var(--space-3) 0 0;
  padding: var(--space-3) var(--space-4);
  background: var(--warning-soft);
  border-left: 3px solid var(--warning);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  color: var(--ink);
  font-size: var(--text-sm);
}

.fb {
  margin-top: var(--space-6);
  padding: var(--space-4);
  border-left: 3px solid var(--accent);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  background: var(--accent-soft);
}

.fb p { margin: 0; overflow-wrap: anywhere; }
.fb p + p { margin-top: var(--space-3); }

.fb-verdict { font-size: var(--text-lg); font-weight: 700; }

.fb-ok { border-color: var(--success); background: var(--success-soft); }
.fb-ok .fb-verdict { color: var(--success); }

.fb-no { border-color: var(--error); background: var(--error-soft); }
.fb-no .fb-verdict { color: var(--error); }

.fb-answer { font-weight: 600; }
.fb-answer code { font-family: var(--font-mono); font-size: var(--text-sm); overflow-wrap: anywhere; }
.fb-mis { color: var(--ink-2); font-size: var(--text-sm); }

.facts { margin: 0; padding-left: var(--space-6); }
.facts li { margin-bottom: var(--space-3); }
.facts li:last-child { margin-bottom: 0; }

.score {
  margin: 0 0 var(--space-2);
  font-size: var(--text-3xl);
  font-weight: 700;
  line-height: var(--leading-tight);
  letter-spacing: -0.02em;
}

.verdict-met { color: var(--success); font-weight: 700; }
.verdict-not { color: var(--warning); font-weight: 700; }

.res-list { margin: var(--space-4) 0 0; padding: 0; list-style: none; }
.res-list li {
  padding: var(--space-4) 0;
  border-top: 1px solid var(--border);
}
.res-list .q { font-weight: 600; overflow-wrap: anywhere; }
.res-list .a { margin-top: var(--space-2); color: var(--ink-2); font-size: var(--text-sm); overflow-wrap: anywhere; }

.spacing {
  margin: var(--space-6) 0 0;
  color: var(--ink-2);
  font-size: var(--text-sm);
}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (min-width: 30rem) {
  .btn-row { grid-auto-flow: column; grid-auto-columns: 1fr; }
}
</style>
</head>

<div class="wrap">
  <header class="top">
    <h1 id="page-title">Practice exercise</h1>
    <p class="goal" id="page-goal"></p>
  </header>
  <main id="app"></main>
</div>

<!-- The build replaces the JSON below with the student's spec (see
     assets/exercise.spec.json). The page reads it at load and needs no
     network access. -->
<script type="application/json" id="spec">
{
  "meta": {
    "title": "Template placeholder",
    "slug": "442-replace-this-spec",
    "goal": "Replace this spec with your own, then publish.",
    "minutes": 2,
    "criterion": { "text": "Get both right.", "minCorrect": 2 }
  },
  "steps": [
    {
      "id": "t1",
      "kind": "choice",
      "prompt": "This island is where the exercise lives. Which one is it?",
      "options": ["A JSON spec", "A screenshot", "A video"],
      "answer": 0,
      "feedback": "The page reads the JSON in the script tag marked id=spec and builds the questions from it.",
      "misconception": { "1": "Nothing here is an image; every question comes from the JSON spec." }
    },
    {
      "id": "t2",
      "kind": "short",
      "prompt": "Write the file name that holds the schema and a worked example.",
      "answer": ["exercise.spec.json", "exercise.spec", "spec.json"],
      "feedback": "assets/exercise.spec.json carries the field guide and a worked example to copy.",
      "misconception": "The schema file is assets/exercise.spec.json, next to assets/exercise.html."
    }
  ]
}
</script>

<script>
(function () {
  "use strict";

  /* The seven step kinds. `explore` is the only one that is not graded. */
  var KINDS = ["choice", "multi", "short", "order", "sort", "match", "explore"];
  var uid = 0;

  // ---- read the spec and drop what cannot be rendered ----------------

  var island = document.getElementById("spec");
  var spec = {};
  try { spec = JSON.parse((island && island.textContent) || "{}"); } catch (err) { spec = {}; }
  if (!spec || typeof spec !== "object") spec = {};

  var meta = (spec.meta && typeof spec.meta === "object") ? spec.meta : {};
  var STEPS = prepareSteps(spec.steps);
  var GRADED_TOTAL = 0;
  STEPS.forEach(function (s) { if (s.kind !== "explore") GRADED_TOTAL += 1; });

  function isArr(v) { return Array.isArray(v); }
  function isNum(v) { return typeof v === "number" && isFinite(v); }
  function inRange(v, n) { return isNum(v) && v === Math.floor(v) && v >= 0 && v < n; }
  function isStrings(v, min) {
    return isArr(v) && v.length >= min && v.every(function (s) { return typeof s === "string" && s.length > 0; });
  }
  function isPermutation(arr, n) {
    if (!isArr(arr) || arr.length !== n) return false;
    var seen = {};
    for (var i = 0; i < arr.length; i += 1) {
      if (!inRange(arr[i], n) || seen[arr[i]]) return false;
      seen[arr[i]] = true;
    }
    return true;
  }

  function prepareSteps(list) {
    if (!isArr(list)) return [];
    var out = [];
    list.forEach(function (s) {
      if (!s || typeof s !== "object") return;
      if (typeof s.prompt !== "string" || !s.prompt) return;
      if (!s.kind) {
        s.kind = (isArr(s.options) && s.options.length) ? "choice" : "short";
      }
      if (KINDS.indexOf(s.kind) === -1) return;
      if (validStep(s)) out.push(s);
    });
    return out;
  }

  /* A step renders only when its own fields are complete. Anything else
     is skipped, so one broken step cannot take the page down. */
  function validStep(s) {
    var k = s.kind;
    if (k === "choice") {
      return isStrings(s.options, 2) && s.options.length <= 5 && inRange(s.answer, s.options.length);
    }
    if (k === "multi") {
      return isStrings(s.options, 1) && isArr(s.answer) && s.answer.length > 0 &&
        s.answer.every(function (n) { return inRange(n, s.options.length); });
    }
    if (k === "short") {
      var list = isArr(s.answer) ? s.answer : [s.answer];
      return list.some(function (a) { return typeof a === "string" && norm(a); });
    }
    if (k === "order") {
      return isStrings(s.options, 2) && isPermutation(s.answer, s.options.length);
    }
    if (k === "sort") {
      if (!isStrings(s.buckets, 2) || s.buckets.length > 3) return false;
      return isArr(s.items) && s.items.length > 0 && s.items.every(function (item) {
        return item && typeof item.text === "string" && item.text && inRange(item.bucket, s.buckets.length);
      });
    }
    if (k === "match") {
      return isStrings(s.lefts, 1) && isStrings(s.rights, 1) && isArr(s.answer) &&
        s.answer.length === s.lefts.length &&
        s.answer.every(function (n) { return inRange(n, s.rights.length); });
    }
    if (k === "explore") {
      var w = s.widget;
      return !!(w && typeof w === "object" && (typeof w.html === "string" || typeof w.js === "string"));
    }
    return false;
  }

  // ---- page furniture -------------------------------------------------

  var app = document.getElementById("app");
  var titleEl = document.getElementById("page-title");
  var goalEl = document.getElementById("page-goal");

  var title = (typeof meta.title === "string" && meta.title) ? meta.title : "Practice exercise";
  titleEl.textContent = title;
  document.title = title;
  if (typeof meta.goal === "string" && meta.goal) goalEl.textContent = meta.goal;
  else if (goalEl) goalEl.remove();

  var latest = new Map();   // step index -> true when the latest try was right
  var screen = "intro";
  var queue = [];           // step indices in this round, in order
  var pos = 0;
  var round = 1;

  function el(tag, attrs, kids) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === "class") node.className = v;
        else if (k === "text") node.textContent = v;
        else if (k.slice(0, 2) === "on") node[k] = v;
        else node.setAttribute(k, v === true ? "" : String(v));
      });
    }
    if (kids) {
      (isArr(kids) ? kids : [kids]).forEach(function (kid) {
        if (kid) node.appendChild(kid);
      });
    }
    return node;
  }

  function mark(node, text) {
    node.appendChild(el("span", { class: "opt-mark", text: text }));
  }

  function clear() {
    while (app.firstChild) app.removeChild(app.firstChild);
  }

  // ---- grading --------------------------------------------------------

  function norm(v) {
    return String(v === null || v === undefined ? "" : v)
      .toLowerCase().trim().replace(/\s+/g, " ").replace(/[.;,!?]+$/, "");
  }

  function accepted(step) {
    var list = isArr(step.answer) ? step.answer : [step.answer];
    return list.map(norm).filter(Boolean);
  }

  function sameOrder(a, b) {
    if (!isArr(a) || a.length !== b.length) return false;
    for (var i = 0; i < a.length; i += 1) { if (a[i] !== b[i]) return false; }
    return true;
  }

  function sameSet(a, b) {
    var x = a.slice().sort(function (p, q) { return p - q; });
    var y = b.slice().sort(function (p, q) { return p - q; });
    return sameOrder(x, y);
  }

  function isCorrect(step, given) {
    switch (step.kind) {
      case "choice":  return given === step.answer;
      case "multi":   return isArr(given) && sameSet(given, step.answer);
      case "short":   return accepted(step).indexOf(norm(given)) !== -1;
      case "order":   return sameOrder(given, step.answer);
      case "sort":    return step.items.every(function (item, i) { return given[i] === item.bucket; });
      case "match":   return sameOrder(given, step.answer);
      default:        return false;
    }
  }

  /* The model answer is shown exactly as the author wrote it, so the
     student reads the real spelling rather than the match key. */
  function firstAnswer(step) {
    var list = isArr(step.answer) ? step.answer : [step.answer];
    var first = list.filter(function (a) { return typeof a === "string" && a.trim(); })[0];
    return first || String(step.answer);
  }

  function modelAnswer(step) {
    switch (step.kind) {
      case "choice": return step.options[step.answer];
      case "multi":  return step.answer.map(function (i) { return step.options[i]; }).join(", ");
      case "short":  return firstAnswer(step);
      case "order":  return step.answer.map(function (i) { return step.options[i]; }).join(" then ");
      case "sort":   return step.items.map(function (item) {
        return item.text + " in " + step.buckets[item.bucket];
      }).join("; ");
      case "match":  return step.lefts.map(function (left, i) {
        return left + " with " + step.rights[step.answer[i]];
      }).join("; ");
      default:       return "";
    }
  }

  function misconceptionKey(step, given) {
    if (step.kind === "choice") return given;
    if (step.kind === "multi") {
      var wrong = (isArr(given) ? given : []).filter(function (i) { return step.answer.indexOf(i) === -1; });
      wrong.sort(function (a, b) { return a - b; });
      return wrong.length ? wrong[0] : "default";
    }
    return "default";
  }

  function misconceptionFor(step, key) {
    var m = step.misconception;
    if (!m) return "";
    if (typeof m === "string") return m;
    if (typeof m === "object") return m[String(key)] || m.default || "";
    return "";
  }

  function criterion() {
    var c = (meta.criterion && typeof meta.criterion === "object") ? meta.criterion : {};
    var min = isNum(c.minCorrect) ? Math.round(c.minCorrect) : Math.ceil(GRADED_TOTAL * 0.8);
    return {
      text: typeof c.text === "string" ? c.text : "",
      minCorrect: Math.max(0, Math.min(min, GRADED_TOTAL))
    };
  }

  // ---- figure ---------------------------------------------------------

  /* svg and html content is injected as markup; code content is shown in
     a pre block. Any element carrying data-reveal becomes a tap or hover
     control that toggles its own caption under the figure. */
  function renderFigure(step) {
    var f = step.figure;
    if (!f || typeof f !== "object" || typeof f.content !== "string" || !f.content) return null;

    var fig = el("figure", { class: "fig" });
    if (f.type === "code") {
      fig.appendChild(el("pre", { class: "fig-code" }, el("code", { text: f.content })));
    } else {
      var body = el("div", { class: "fig-body" });
      body.innerHTML = f.content;
      fig.appendChild(body);
      wireReveals(fig, body.querySelectorAll("[data-reveal]"));
    }
    if (typeof f.caption === "string" && f.caption) {
      fig.appendChild(el("figcaption", { class: "fig-cap", text: f.caption }));
    }
    return fig;
  }

  function wireReveals(fig, nodes) {
    if (!nodes || !nodes.length) return;
    var wrap = el("div", { class: "reveals" });
    Array.prototype.forEach.call(nodes, function (node) {
      var text = node.getAttribute("data-reveal");
      if (!text) return;
      var cap = el("p", { class: "reveal-cap", text: text, hidden: true, id: "reveal-" + (uid += 1) });
      node.classList.add("reveal");
      node.setAttribute("tabindex", "0");
      node.setAttribute("role", "button");
      node.setAttribute("aria-expanded", "false");
      node.setAttribute("aria-controls", cap.id);
      wrap.appendChild(cap);

      var on = false;
      function show(next) {
        on = (next === undefined) ? !on : next;
        cap.hidden = !on;
        node.setAttribute("aria-expanded", on ? "true" : "false");
        node.classList.toggle("reveal-on", on);
      }
      node.addEventListener("click", function () { show(); });
      node.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
          e.preventDefault();
          show();
        }
      });
      if (window.matchMedia && window.matchMedia("(hover: hover)").matches) {
        node.addEventListener("mouseenter", function () { show(true); });
        node.addEventListener("mouseleave", function () { show(false); });
      }
    });
    if (wrap.firstChild) fig.appendChild(wrap);
  }

  // ---- widget ---------------------------------------------------------

  /* The engine renders the controls, keeps the current values, and calls
     the author's js(values, root) at start and on every change. */
  function renderWidget(step) {
    var w = step.widget;
    if (!w || typeof w !== "object") return null;

    var box = el("section", { class: "widget" });
    var play = el("div", { class: "play" });
    if (typeof w.html === "string") play.innerHTML = w.html;
    box.appendChild(play);

    var values = {};
    var fn = compile(w.js);
    function run() {
      if (!fn) return;
      try { fn(values, play); } catch (err) { if (window.console) console.error(err); }
    }

    var controls = isArr(w.controls) ? w.controls : [];
    if (controls.length) {
      var wrap = el("div", { class: "controls" });
      controls.forEach(function (c) {
        var node = renderControl(c, values, run);
        if (node) wrap.appendChild(node);
      });
      if (wrap.firstChild) box.appendChild(wrap);
    }
    if (typeof w.caption === "string" && w.caption) {
      box.appendChild(el("p", { class: "widget-cap", text: w.caption }));
    }
    return { node: box, start: run };
  }

  function compile(src) {
    if (typeof src !== "string" || !src.trim()) return null;
    try {
      var fn = (new Function("return (" + src + ");"))();
      return typeof fn === "function" ? fn : null;
    } catch (err) {
      if (window.console) console.error(err);
      return null;
    }
  }

  function renderControl(c, values, run) {
    if (!c || typeof c !== "object") return null;
    var name = typeof c.name === "string" && c.name ? c.name : "value";
    var label = typeof c.label === "string" && c.label ? c.label : name;
    var id = "ctl-" + (uid += 1);

    if (c.type === "range") {
      var min = isNum(c.min) ? c.min : 0;
      var max = isNum(c.max) ? c.max : 100;
      var stepSize = isNum(c.step) ? c.step : 1;
      var start = isNum(c.value) ? c.value : min;
      values[name] = start;
      var out = el("span", { class: "ctl-out", text: withUnit(start, c.unit) });
      var range = el("input", {
        class: "rng", id: id, type: "range",
        min: min, max: max, step: stepSize, value: start
      });
      range.addEventListener("input", function () {
        values[name] = Number(range.value);
        out.textContent = withUnit(Number(range.value), c.unit);
        run();
      });
      return el("div", { class: "ctl" }, [
        el("label", { class: "ctl-lbl", for: id, text: label }),
        el("div", { class: "ctl-row" }, [range, out])
      ]);
    }

    if (c.type === "switch") {
      values[name] = !!c.value;
      var box = el("input", { class: "sw", id: id, type: "checkbox" });
      box.checked = !!c.value;
      box.addEventListener("change", function () { values[name] = box.checked; run(); });
      return el("div", { class: "ctl" }, [
        el("label", { class: "ctl-switch", for: id }, [
          box,
          el("span", { class: "ctl-lbl", text: label })
        ])
      ]);
    }

    if (c.type === "select") {
      var options = isArr(c.options) ? c.options : [];
      var select = el("select", { class: "sel", id: id });
      options.forEach(function (o) {
        var v = (o && typeof o === "object") ? String(o.value) : String(o);
        var t = (o && typeof o === "object" && o.label) ? String(o.label) : v;
        select.appendChild(el("option", { value: v, text: t }));
      });
      var pick = (c.value !== undefined) ? String(c.value) : "";
      if (pick) select.value = pick;
      values[name] = select.value;
      select.addEventListener("change", function () { values[name] = select.value; run(); });
      return el("div", { class: "ctl" }, [
        el("label", { class: "ctl-lbl", for: id, text: label }),
        select
      ]);
    }

    return null;
  }

  function withUnit(v, unit) {
    return String(v) + (typeof unit === "string" && unit ? " " + unit : "");
  }

  // ---- screens --------------------------------------------------------

  function progressBar(label) {
    var n = queue.length;
    var fill = el("div", { class: "bar-fill" });
    var bar = el("div", {
      class: "bar", role: "progressbar",
      "aria-valuemin": "0", "aria-valuemax": String(n), "aria-valuenow": String(pos),
      "aria-label": label
    }, fill);
    fill.style.width = (n ? (pos / n) * 100 : 0) + "%";
    return {
      node: el("div", { class: "progress" }, [
        el("div", { class: "progress-label" }, [
          el("span", { text: label }),
          el("span", { text: (pos + 1) + " / " + n })
        ]),
        bar
      ]),
      fill: fill, bar: bar, n: n
    };
  }

  function renderIntro() {
    clear();
    var n = STEPS.length;
    var minutes = isNum(meta.minutes)
      ? meta.minutes + (meta.minutes === 1 ? " minute" : " minutes")
      : "a few minutes";
    var c = criterion();
    var graded = GRADED_TOTAL === n
      ? n + (n === 1 ? " step" : " steps")
      : GRADED_TOTAL + " graded steps and " + (n - GRADED_TOTAL) + " to explore";
    var card = el("section", { class: "card" }, [
      el("ul", { class: "facts" }, [
        el("li", { text: graded + ", about " + minutes + "." }),
        el("li", { text: "Answer each one before you check it. Trying first is what makes it stick." }),
        c.text ? el("li", { text: "Done means: " + c.text }) : null
      ]),
      el("div", { class: "btn-row" }, [
        el("button", { class: "btn btn-primary", type: "button", text: "Start", onclick: startRound })
      ])
    ]);
    app.appendChild(card);
    var first = card.querySelector("button");
    if (first) first.focus();
  }

  function startRound() {
    screen = "question";
    round = 1;
    queue = STEPS.map(function (_, i) { return i; });
    pos = 0;
    render();
  }

  function startMissedRound(indices) {
    screen = "question";
    round += 1;
    queue = indices.slice();
    pos = 0;
    render();
  }

  function render() {
    if (!STEPS.length) {
      clear();
      app.appendChild(el("section", { class: "card" }, [
        el("p", { class: "prompt", text: "This exercise has no steps yet." }),
        el("p", { text: "The JSON in this page is empty or not valid. Add a meta block and a steps list." })
      ]));
      return;
    }
    if (screen === "intro") return renderIntro();
    if (screen === "question") return renderQuestion();
    return renderResults();
  }

  function renderQuestion() {
    clear();
    var i = queue[pos];
    var step = STEPS[i];
    var first = round === 1;
    var label = (first ? "Step " : "Again ") + (pos + 1) + " of " + queue.length;
    var p = progressBar(label);

    var card = el("section", { class: "card" });
    card.appendChild(p.node);

    var fig = renderFigure(step);
    if (fig) card.appendChild(fig);

    card.appendChild(el("h2", { class: "prompt", id: "prompt", tabindex: "-1", text: step.prompt }));

    var widget = renderWidget(step);
    if (widget) card.appendChild(widget.node);

    if (step.kind === "explore") {
      card.appendChild(el("div", { class: "answer" }, [
        el("div", { class: "btn-row" }, [
          el("button", { class: "btn btn-primary", type: "button", text: "Continue", onclick: function () { advance(p); } })
        ])
      ]));
    } else {
      card.appendChild(renderAnswer(step, i, p, card));
    }

    if (step.hint && first) {
      var hintBox = el("p", { class: "hint", text: step.hint, hidden: true });
      var hintBtn = el("button", {
        class: "btn btn-quiet hint-btn", type: "button", text: "Show a hint",
        onclick: function () { hintBox.hidden = false; hintBtn.remove(); }
      });
      card.appendChild(hintBtn);
      card.appendChild(hintBox);
    }

    app.appendChild(card);
    if (widget) widget.start();

    var heading = card.querySelector(".prompt");
    if (heading) heading.focus();
  }

  function renderAnswer(step, i, p, card) {
    switch (step.kind) {
      case "choice": return renderChoice(step, i, p, card);
      case "multi":  return renderMulti(step, i, p, card);
      case "short":  return renderShort(step, i, p, card);
      case "order":  return renderOrder(step, i, p, card);
      case "sort":   return renderAssign(step, i, p, card, "sort");
      case "match":  return renderAssign(step, i, p, card, "match");
      default:       return el("div");
    }
  }

  function renderChoice(step, i, p, card) {
    var list = el("div", { class: "opts", role: "group", "aria-label": "Choose one" });
    step.options.forEach(function (text, idx) {
      var btn = el("button", { class: "opt", type: "button" }, [
        el("span", { class: "opt-key", text: String.fromCharCode(65 + idx) }),
        el("span", { class: "opt-text", text: text })
      ]);
      btn.addEventListener("click", function () { submit_apply(i, idx, p, card); });
      list.appendChild(btn);
    });
    return list;
  }

  function renderMulti(step, i, p, card) {
    var picked = [];
    var list = el("div", { class: "opts", role: "group", "aria-label": "Choose every answer that fits" });
    step.options.forEach(function (text, idx) {
      var btn = el("button", { class: "opt", type: "button", "aria-pressed": "false" }, [
        el("span", { class: "opt-key", text: String.fromCharCode(65 + idx) }),
        el("span", { class: "opt-text", text: text })
      ]);
      btn.addEventListener("click", function () {
        var at = picked.indexOf(idx);
        if (at === -1) picked.push(idx); else picked.splice(at, 1);
        btn.setAttribute("aria-pressed", at === -1 ? "true" : "false");
        btn.setAttribute("data-picked", at === -1 ? "yes" : "no");
      });
      list.appendChild(btn);
    });
    var submitBtn = el("button", {
      class: "btn btn-primary", type: "button", text: "Check answers",
      onclick: function () { submit_apply(i, picked.slice(), p, card); }
    });
    return el("div", { class: "answer" }, [list, el("div", { class: "btn-row" }, [submitBtn])]);
  }

  function renderShort(step, i, p, card) {
    var form = el("form", { class: "short answer", novalidate: true });
    var input = el("input", {
      class: "inp", id: "answer-input", type: "text", name: "answer",
      autocomplete: "off", autocapitalize: "off", autocorrect: "off", spellcheck: "false",
      placeholder: "Type your answer", "aria-label": "Your answer"
    });
    form.appendChild(el("label", { class: "lbl", for: "answer-input", text: "Your answer, from memory" }));
    form.appendChild(input);
    form.appendChild(el("button", { class: "btn btn-primary", type: "submit", text: "Check answer" }));
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      submit_apply(i, input.value, p, card);
    });
    return form;
  }

  function renderOrder(step, i, p, card) {
    var seq = [];
    var picked = el("ol", { class: "chips" });
    var pool = el("div", { class: "opts", role: "group", "aria-label": "Items to place" });
    var submitBtn = el("button", { class: "btn btn-primary", type: "button", text: "Check order", disabled: true });
    var undoBtn = el("button", { class: "btn btn-quiet", type: "button", text: "Undo", disabled: true });

    var poolButtons = step.options.map(function (text, idx) {
      var btn = el("button", { class: "opt", type: "button" }, el("span", { class: "opt-text", text: text }));
      btn.addEventListener("click", function () { pick(idx); });
      pool.appendChild(btn);
      return btn;
    });

    function sync() {
      submitBtn.disabled = seq.length !== step.options.length;
      undoBtn.disabled = seq.length === 0;
      poolButtons.forEach(function (btn, idx) { btn.disabled = seq.indexOf(idx) !== -1; });
      while (picked.firstChild) picked.removeChild(picked.firstChild);
      seq.forEach(function (idx, n) {
        picked.appendChild(el("li", { class: "chip" }, [
          el("span", { class: "chip-n", text: (n + 1) + "." }),
          el("span", { class: "opt-text", text: step.options[idx] })
        ]));
      });
    }
    function pick(idx) {
      if (seq.indexOf(idx) !== -1) return;
      seq.push(idx);
      sync();
    }
    function undo() { seq.pop(); sync(); }

    undoBtn.addEventListener("click", undo);
    submitBtn.addEventListener("click", function () { submit_apply(i, seq.slice(), p, card); });

    var wrap = el("div", { class: "answer order" }, [
      el("p", { class: "lbl", text: "Your order" }),
      picked,
      el("p", { class: "lbl", text: "Tap to place these" }),
      pool,
      el("div", { class: "btn-row" }, [undoBtn, submitBtn])
    ]);
    sync();
    return wrap;
  }

  /* sort and match share one shape: one row per item, one button per
     bucket (sort) or per partner (match). */
  function renderAssign(step, i, p, card, kind) {
    var rows = kind === "sort"
      ? step.items.map(function (item) { return item.text; })
      : step.lefts.slice();
    var choices = kind === "sort" ? step.buckets : step.rights;
    var chosen = rows.map(function () { return -1; });
    var buttonsPerRow = [];

    var wrap = el("div", { class: "assign" });
    rows.forEach(function (text, r) {
      var buttons = choices.map(function (choice, c) {
        var btn = el("button", { class: "abtn", type: "button", "aria-pressed": "false", text: choice });
        btn.addEventListener("click", function () { choose(r, c); });
        return btn;
      });
      buttonsPerRow.push(buttons);
      wrap.appendChild(el("div", { class: "arow", role: "group", "aria-label": text }, [
        el("p", { class: "atext", text: text }),
        el("div", { class: "abtns" }, buttons)
      ]));
    });

    var submitBtn = el("button", { class: "btn btn-primary", type: "button", text: "Check answers", disabled: true });

    function choose(r, c) {
      chosen[r] = c;
      buttonsPerRow[r].forEach(function (btn, k) {
        btn.setAttribute("aria-pressed", k === c ? "true" : "false");
      });
      submitBtn.disabled = chosen.indexOf(-1) !== -1;
    }
    submitBtn.addEventListener("click", function () { submit_apply(i, chosen.slice(), p, card); });

    return el("div", { class: "answer" }, [wrap, el("div", { class: "btn-row" }, [submitBtn])]);
  }

  /* Named submit_apply so the local `submit` button above cannot shadow it. */
  function submit_apply(stepIndex, given, p, card) {
    var step = STEPS[stepIndex];
    var ok = isCorrect(step, given);
    latest.set(stepIndex, ok);

    lockAndMark(step, given, card);

    // Every answer control is locked once the step is answered.
    Array.prototype.forEach.call(card.querySelectorAll(".answer button"), function (btn) {
      btn.disabled = true;
    });

    p.fill.style.width = ((pos + 1) / p.n) * 100 + "%";
    p.bar.setAttribute("aria-valuenow", String(pos + 1));

    // A hint has done its job once the step is answered.
    var hintBtn = card.querySelector(".hint-btn");
    if (hintBtn) hintBtn.remove();
    var hintBox = card.querySelector(".hint");
    if (hintBox) hintBox.remove();

    var box = feedback(step, ok, given);
    card.appendChild(box);
    card.appendChild(nextRow(p, "Next step"));
    box.focus();
  }

  function advance(p) {
    p.fill.style.width = ((pos + 1) / p.n) * 100 + "%";
    p.bar.setAttribute("aria-valuenow", String(pos + 1));
    next(p, "Continue");
  }

  function nextRow(p, label) {
    var last = pos === queue.length - 1;
    return el("div", { class: "btn-row" }, [
      el("button", {
        class: "btn btn-primary", type: "button",
        text: last ? "See results" : label,
        onclick: function () { next(p, label); }
      })
    ]);
  }

  function next(p) {
    if (pos === queue.length - 1) { screen = "results"; render(); }
    else { pos += 1; render(); }
  }

  function lockAndMark(step, given, card) {
    var k = step.kind;

    if (k === "choice") {
      Array.prototype.forEach.call(card.querySelectorAll(".opt"), function (btn, idx) {
        btn.disabled = true;
        if (idx === step.answer) { btn.setAttribute("data-state", "right"); mark(btn, "Right answer"); }
        else if (idx === given) { btn.setAttribute("data-state", "wrong"); mark(btn, "Your answer"); }
        else { btn.setAttribute("data-state", "muted"); }
      });
      return;
    }

    if (k === "multi") {
      var chosen = isArr(given) ? given : [];
      Array.prototype.forEach.call(card.querySelectorAll(".opt"), function (btn, idx) {
        btn.disabled = true;
        var right = step.answer.indexOf(idx) !== -1;
        var picked = chosen.indexOf(idx) !== -1;
        if (right) { btn.setAttribute("data-state", "right"); mark(btn, picked ? "Right answer" : "Right answer, not picked"); }
        else if (picked) { btn.setAttribute("data-state", "wrong"); mark(btn, "Your answer"); }
        else { btn.setAttribute("data-state", "muted"); }
      });
      return;
    }

    if (k === "short") {
      var form = card.querySelector(".short");
      if (form) {
        var input = form.querySelector("input");
        if (input) input.readOnly = true;
        var submitBtn = form.querySelector("button");
        if (submitBtn) submitBtn.remove();
      }
      return;
    }

    if (k === "order") {
      var wrap = card.querySelector(".order");
      if (!wrap) return;
      Array.prototype.forEach.call(wrap.querySelectorAll(".chip"), function (chip, n) {
        var ok = given[n] === step.answer[n];
        chip.setAttribute("data-state", ok ? "right" : "wrong");
        mark(chip, ok ? "Right" : "Not right");
      });
      Array.prototype.forEach.call(wrap.querySelectorAll(".opt"), function (btn) {
        btn.disabled = true;
        btn.setAttribute("data-state", "muted");
      });
      var undoBtn = wrap.querySelector(".btn-quiet");
      if (undoBtn) undoBtn.remove();
      return;
    }

    if (k === "sort" || k === "match") {
      Array.prototype.forEach.call(card.querySelectorAll(".arow"), function (row, r) {
        var correct = k === "sort" ? step.items[r].bucket : step.answer[r];
        var chose = given[r];
        Array.prototype.forEach.call(row.querySelectorAll(".abtn"), function (btn, c) {
          btn.disabled = true;
          if (c === correct) btn.setAttribute("data-state", "right");
          else if (c === chose) btn.setAttribute("data-state", "wrong");
          else btn.setAttribute("data-state", "muted");
        });
        row.setAttribute("data-state", chose === correct ? "right" : "wrong");
        mark(row, chose === correct ? "Right" : "Not right");
      });
    }
  }

  function feedback(step, ok, given) {
    var box = el("div", { class: "fb " + (ok ? "fb-ok" : "fb-no"), role: "status", tabindex: "-1" });
    box.appendChild(el("p", { class: "fb-verdict", text: ok ? "Correct" : "Not yet" }));
    if (!ok) {
      box.appendChild(el("p", { class: "fb-answer" }, [
        document.createTextNode("Right answer: "),
        el("code", { text: modelAnswer(step) })
      ]));
    }
    if (step.feedback) box.appendChild(el("p", { class: "fb-why", text: step.feedback }));
    var mis = ok ? "" : misconceptionFor(step, misconceptionKey(step, given));
    if (mis) box.appendChild(el("p", { class: "fb-mis", text: "Watch out: " + mis }));
    return box;
  }

  // ---- results --------------------------------------------------------

  function renderResults() {
    clear();
    var c = criterion();
    var graded = queue.filter(function (i) { return STEPS[i].kind !== "explore"; });
    var right = graded.filter(function (i) { return latest.get(i) === true; }).length;
    var missed = graded.filter(function (i) { return latest.get(i) !== true; });
    var overall = 0;
    STEPS.forEach(function (s, i) {
      if (s.kind !== "explore" && latest.get(i) === true) overall += 1;
    });
    var firstPass = round === 1;
    var met = overall >= c.minCorrect;

    var card = el("section", { class: "card" });
    card.appendChild(el("p", { class: "score", text: right + " of " + graded.length }));
    card.appendChild(el("p", {
      text: firstPass
        ? (graded.length && right === graded.length
            ? "All right on the first pass, out of " + graded.length + " graded steps."
            : "Right on the first pass: " + right + " of " + graded.length + " graded steps.")
        : "Right this round. Overall: " + overall + " of " + GRADED_TOTAL + " graded steps."
    }));

    if (c.text) {
      card.appendChild(el("p", { class: "spacing" }, [
        el("span", { class: "verdict-" + (met ? "met" : "not"), text: met ? "Criterion met. " : "Not met yet. " }),
        document.createTextNode(c.text)
      ]));
    }

    if (missed.length) {
      var list = el("ul", { class: "res-list" });
      missed.forEach(function (i) {
        var step = STEPS[i];
        list.appendChild(el("li", {}, [
          el("p", { class: "q", text: step.prompt }),
          el("p", { class: "a", text: "Answer: " + modelAnswer(step) }),
          step.feedback ? el("p", { class: "a", text: step.feedback }) : null
        ]));
      });
      card.appendChild(el("h2", { class: "prompt", style: "margin-top:var(--space-6);font-size:var(--text-lg)", text: "Still to learn" }));
      card.appendChild(list);
    }

    var buttons = [];
    if (missed.length) {
      buttons.push(el("button", {
        class: "btn btn-primary", type: "button",
        text: "Redo the " + missed.length + " you missed",
        onclick: function () { startMissedRound(missed); }
      }));
    }
    buttons.push(el("button", {
      class: missed.length ? "btn btn-quiet" : "btn btn-primary",
      type: "button",
      text: "Start over",
      onclick: function () { latest.clear(); startRound(); }
    }));
    card.appendChild(el("div", { class: "btn-row" }, buttons));

    card.appendChild(el("p", {
      class: "spacing",
      text: missed.length
        ? "Do these " + missed.length + " again tomorrow, not in ten minutes. The gap is what makes them stick."
        : "Come back in a day or two and run this again. Spacing the same steps over days is what makes them stay."
    }));

    app.appendChild(card);
    var first = card.querySelector("button");
    if (first) first.focus();
  }

  render();
})();
</script>
</body>
</html>
