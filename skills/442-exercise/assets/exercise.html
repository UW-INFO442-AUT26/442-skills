<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="description" content="INFO 442 practice exercise. Answer first, then check." />
<title>Practice exercise</title>
<style>
/* ------------------------------------------------------------------
   Design tokens vendored from skills/442-brand/tokens.css (INFO 442
   brand). This is a mirror kept inline so the page stays a single
   self-contained file. Change a value in 442-brand/tokens.css and in
   442-brand/STYLE.md first, then re-copy it here.
   ------------------------------------------------------------------ */
:root {
  /* Brand - use as marks, not as fields. */
  --uw-purple:      #4B2E83;
  --uw-purple-deep: #351F63;
  --uw-gold:        #B7A57A;
  --uw-gold-deep:   #85754D;

  /* Neutrals - the actual surface. */
  --bg:       #F7F7FB;
  --surface:  #FFFFFF;
  --surface-2:#EDEDF4;
  --ink:      #16151D;
  --ink-2:    #3C3B4A;
  --muted:    #6B6A7B;
  --border:   #DADAE4;

  /* One accent carries interaction. */
  --accent:      #6C4AB6;
  --accent-ink:  #FFFFFF;
  --accent-soft: #EDE7FB;

  /* Semantic state - reserve for real state, never decoration. */
  --success: #1F7A5C;
  --success-soft: #E2F3EC;
  --warning: #9A6414;
  --warning-soft: #FBEEDA;
  --error:   #A32B32;
  --error-soft: #FBE6E7;
  --info:    #2F5F96;
  --info-soft: #E6EEF8;

  /* Type */
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.375rem;
  --text-2xl: 1.75rem;
  --text-3xl: 2.25rem;
  --leading: 1.55;
  --leading-tight: 1.2;

  /* Space - 4 px base */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-12: 3rem;

  --radius: 10px;
  --radius-sm: 6px;
  --radius-pill: 999px;
  --shadow-1: 0 1px 2px rgba(22, 21, 29, 0.06), 0 1px 3px rgba(22, 21, 29, 0.08);
  --shadow-2: 0 6px 16px rgba(22, 21, 29, 0.10);
  --tap: 44px;

  --motion: 160ms;
  --ease: cubic-bezier(0.2, 0, 0, 1);
}

@media (prefers-reduced-motion: reduce) {
  :root { --motion: 1ms; }
}

/* Dark surface, opt-in with <html data-theme="dark">. */
[data-theme="dark"] {
  --bg:       #0F0E15;
  --surface:  #1A1822;
  --surface-2:#242230;
  --ink:      #F2F1F7;
  --ink-2:    #C9C7D6;
  --muted:    #9A98AC;
  --border:   #302E3C;
  --accent:      #9B7BE0;
  --accent-ink:  #14121B;
  --accent-soft: #2A2340;
  --uw-purple: #8A6FC7;
  --uw-gold:   #D2C49B;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: var(--leading);
  -webkit-text-size-adjust: 100%;
}

@media (prefers-reduced-motion: no-preference) {
  a, button { transition: color var(--motion) var(--ease), background var(--motion) var(--ease); }
}

/* ------------------------------------------------------------------
   Exercise layout. Mobile first: one 360 px column, vertical only.
   ------------------------------------------------------------------ */
.wrap {
  max-width: 34rem;
  margin: 0 auto;
  padding: var(--space-6) var(--space-4) var(--space-12);
  padding-bottom: calc(var(--space-12) + env(safe-area-inset-bottom));
}

.top { padding-bottom: var(--space-4); }

.badge {
  display: inline-block;
  margin: 0 0 var(--space-3);
  padding: var(--space-1) var(--space-3);
  background: var(--uw-purple);
  color: #FFFFFF;
  border-radius: var(--radius-pill);
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  font-size: var(--text-2xl);
  line-height: var(--leading-tight);
  letter-spacing: -0.01em;
  overflow-wrap: anywhere;
}

/* The UW purple mark: a short rule under the title, never a field. */
h1::after {
  content: "";
  display: block;
  width: 2.5rem;
  height: 3px;
  margin-top: var(--space-3);
  background: var(--uw-purple);
  border-radius: var(--radius-pill);
}

.goal {
  margin: var(--space-4) 0 0;
  color: var(--ink-2);
  font-size: var(--text-lg);
  overflow-wrap: anywhere;
}

.card {
  margin-top: var(--space-6);
  padding: var(--space-6) var(--space-4);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-1);
}

.progress { margin-bottom: var(--space-4); }

.progress-label {
  display: flex;
  justify-content: space-between;
  gap: var(--space-3);
  color: var(--muted);
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.bar {
  height: 6px;
  margin-top: var(--space-2);
  background: var(--surface-2);
  border-radius: var(--radius-pill);
  overflow: hidden;
}

.bar-fill {
  width: 0;
  height: 100%;
  background: var(--accent);
  border-radius: var(--radius-pill);
  transition: width var(--motion) var(--ease);
}

.tag {
  display: inline-block;
  margin-bottom: var(--space-3);
  padding: var(--space-1) var(--space-2);
  background: var(--accent-soft);
  color: var(--uw-purple-deep);
  border-radius: var(--radius-pill);
  font-size: var(--text-xs);
}

.prompt {
  margin: 0 0 var(--space-6);
  font-size: var(--text-xl);
  line-height: var(--leading-tight);
  font-weight: 600;
  overflow-wrap: anywhere;
}

.opts { display: grid; gap: var(--space-3); }

.opt {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  width: 100%;
  min-height: var(--tap);
  padding: var(--space-3) var(--space-4);
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font: inherit;
  font-size: var(--text-base);
  line-height: var(--leading);
  text-align: left;
  cursor: pointer;
}

.opt:hover:not(:disabled) { border-color: var(--accent); }

.opt:disabled { cursor: default; }

.opt-key {
  flex: none;
  width: 1.5rem;
  height: 1.5rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--ink-2);
  font-size: var(--text-sm);
  font-weight: 600;
  line-height: 1.4rem;
  text-align: center;
}

.opt-text { overflow-wrap: anywhere; }

.opt-mark {
  display: block;
  margin-top: var(--space-1);
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

.opt[data-state="right"] {
  background: var(--success-soft);
  border-color: var(--success);
  border-width: 2px;
  padding: calc(var(--space-3) - 1px) calc(var(--space-4) - 1px);
}
.opt[data-state="right"] .opt-mark { color: var(--success); }
.opt[data-state="right"] .opt-key { border-color: var(--success); color: var(--success); }

.opt[data-state="wrong"] {
  background: var(--error-soft);
  border-color: var(--error);
  border-width: 2px;
  padding: calc(var(--space-3) - 1px) calc(var(--space-4) - 1px);
}
.opt[data-state="wrong"] .opt-mark { color: var(--error); }
.opt[data-state="wrong"] .opt-key { border-color: var(--error); color: var(--error); }

.opt[data-state="muted"] { opacity: 1; color: var(--muted); }
.opt[data-state="muted"] .opt-key { color: var(--muted); }

.short { display: grid; gap: var(--space-2); }

.lbl {
  color: var(--ink-2);
  font-size: var(--text-sm);
  font-weight: 600;
}

.inp {
  width: 100%;
  min-height: var(--tap);
  padding: var(--space-3) var(--space-4);
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font: inherit;
  font-size: var(--text-base);
}

.inp:focus-visible { border-color: var(--accent); }

.btn {
  min-height: var(--tap);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font: inherit;
  font-size: var(--text-base);
  font-weight: 600;
  cursor: pointer;
}

.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--uw-purple); }

.btn-quiet {
  background: transparent;
  color: var(--ink);
  border-color: var(--border);
}
.btn-quiet:hover { border-color: var(--ink-2); }

.btn-row {
  display: grid;
  gap: var(--space-3);
  margin-top: var(--space-6);
}

.hint-btn { margin-top: var(--space-4); }
.hint {
  margin: var(--space-3) 0 0;
  padding: var(--space-3) var(--space-4);
  background: var(--warning-soft);
  border-left: 3px solid var(--warning);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  color: var(--ink);
  font-size: var(--text-sm);
}

.fb {
  margin-top: var(--space-6);
  padding: var(--space-4);
  border-left: 3px solid var(--accent);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  background: var(--accent-soft);
}

.fb p { margin: 0; overflow-wrap: anywhere; }
.fb p + p { margin-top: var(--space-3); }

.fb-verdict { font-size: var(--text-lg); font-weight: 700; }

.fb-ok { border-color: var(--success); background: var(--success-soft); }
.fb-ok .fb-verdict { color: var(--success); }

.fb-no { border-color: var(--error); background: var(--error-soft); }
.fb-no .fb-verdict { color: var(--error); }

.fb-answer { font-weight: 600; }
.fb-answer code { font-family: var(--font-mono); font-size: var(--text-sm); }
.fb-mis { color: var(--ink-2); font-size: var(--text-sm); }

.facts { margin: 0; padding-left: var(--space-6); }
.facts li { margin-bottom: var(--space-3); }
.facts li:last-child { margin-bottom: 0; }

.score {
  margin: 0 0 var(--space-2);
  font-size: var(--text-3xl);
  font-weight: 700;
  line-height: var(--leading-tight);
  letter-spacing: -0.02em;
}

.verdict-met { color: var(--success); font-weight: 700; }
.verdict-not { color: var(--warning); font-weight: 700; }

.res-list { margin: var(--space-4) 0 0; padding: 0; list-style: none; }
.res-list li {
  padding: var(--space-4) 0;
  border-top: 1px solid var(--border);
}
.res-list .q { font-weight: 600; overflow-wrap: anywhere; }
.res-list .a { margin-top: var(--space-2); color: var(--ink-2); font-size: var(--text-sm); overflow-wrap: anywhere; }

.spacing {
  margin: var(--space-6) 0 0;
  color: var(--ink-2);
  font-size: var(--text-sm);
}

.foot {
  margin-top: var(--space-6);
  color: var(--muted);
  font-size: var(--text-xs);
}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (min-width: 30rem) {
  .btn-row { grid-auto-flow: column; grid-auto-columns: 1fr; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="badge">INFO 442</span>
    <h1 id="page-title">Practice exercise</h1>
    <p class="goal" id="page-goal"></p>
  </header>
  <main id="app"></main>
</div>

<!-- The build replaces the JSON below with the student's spec (see
     assets/exercise.spec.json). The page reads it at load and needs no
     network access. -->
<script type="application/json" id="spec">
{
  "meta": {
    "title": "Template placeholder",
    "slug": "442-replace-this-spec",
    "goal": "Replace this spec with your own, then publish.",
    "minutes": 2,
    "criterion": { "text": "Get both right.", "minCorrect": 2 }
  },
  "steps": [
    {
      "id": "t1",
      "kind": "choice",
      "prompt": "This island is where the exercise lives. Which one is it?",
      "options": ["A JSON spec", "A screenshot", "A video"],
      "answer": 0,
      "feedback": "The page reads the JSON in the script tag marked id=spec and builds the questions from it.",
      "misconception": { "1": "Nothing here is an image; every question comes from the JSON spec." }
    },
    {
      "id": "t2",
      "kind": "short",
      "prompt": "Write the file name that holds the schema and a worked example.",
      "answer": ["exercise.spec.json", "exercise.spec", "spec.json"],
      "feedback": "assets/exercise.spec.json carries the field guide and a five step example to copy.",
      "misconception": "The schema file is assets/exercise.spec.json, next to assets/exercise.html."
    }
  ]
}
</script>

<script>
(function () {
  "use strict";

  var raw = document.getElementById("spec");
  var spec = {};
  try { spec = JSON.parse(raw.textContent || "{}"); } catch (err) { spec = {}; }

  var meta = spec.meta || {};
  var steps = (spec.steps || []).filter(function (s) { return s && s.prompt; });
  steps.forEach(function (s) {
    if (!s.kind) s.kind = (Array.isArray(s.options) && s.options.length) ? "choice" : "short";
  });

  var app = document.getElementById("app");
  var titleEl = document.getElementById("page-title");
  var goalEl = document.getElementById("page-goal");

  var title = meta.title || "Practice exercise";
  titleEl.textContent = title;
  document.title = title;
  if (meta.goal) goalEl.textContent = meta.goal; else goalEl.remove();

  // latest attempt outcome for each step index
  var latest = new Map();
  var screen = "intro";
  var queue = [];
  var pos = 0;
  var round = 1;

  function el(tag, attrs, kids) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === "class") node.className = v;
        else if (k === "text") node.textContent = v;
        else if (k.slice(0, 2) === "on") node[k] = v;
        else node.setAttribute(k, v === true ? "" : String(v));
      });
    }
    if (kids) {
      (Array.isArray(kids) ? kids : [kids]).forEach(function (kid) {
        if (kid) node.appendChild(kid);
      });
    }
    return node;
  }

  function clear() {
    while (app.firstChild) app.removeChild(app.firstChild);
  }

  function norm(s) {
    return String(s === null || s === undefined ? "" : s)
      .toLowerCase().trim().replace(/\s+/g, " ").replace(/[.;,!?]+$/, "");
  }

  function accepted(step) {
    var a = step.answer;
    var list = Array.isArray(a) ? a : [a];
    return list.map(norm).filter(Boolean);
  }

  function modelAnswer(step) {
    if (step.kind === "choice" && Array.isArray(step.options)) {
      var i = typeof step.answer === "number" ? step.answer : step.options.indexOf(step.answer);
      return i >= 0 && i < step.options.length ? step.options[i] : String(step.answer);
    }
    return accepted(step)[0] || String(step.answer);
  }

  function isCorrect(step, given) {
    if (step.kind === "choice") {
      if (typeof step.answer === "number") return given === step.answer;
      return norm(step.options[given]) === norm(step.answer);
    }
    return accepted(step).indexOf(norm(given)) !== -1;
  }

  function misconceptionFor(step, key) {
    var m = step.misconception;
    if (!m) return "";
    if (typeof m === "string") return m;
    if (Array.isArray(m)) return m[key] || "";
    return m[String(key)] || m.default || "";
  }

  function criterion() {
    var c = meta.criterion || {};
    var min = typeof c.minCorrect === "number" ? c.minCorrect : Math.ceil(steps.length * 0.8);
    return { text: c.text || "", minCorrect: Math.min(Math.max(min, 1), steps.length) };
  }

  function progressBar(label) {
    var n = queue.length;
    var fill = el("div", { class: "bar-fill" });
    var bar = el("div", {
      class: "bar", role: "progressbar",
      "aria-valuemin": "0", "aria-valuemax": String(n), "aria-valuenow": String(pos),
      "aria-label": label
    }, fill);
    fill.style.width = (n ? (pos / n) * 100 : 0) + "%";
    return { node: el("div", { class: "progress" }, [
      el("div", { class: "progress-label" }, [
        el("span", { text: label }),
        el("span", { text: (pos + 1) + " / " + n })
      ]),
      bar
    ]), fill: fill, bar: bar, n: n };
  }

  // ---- intro ----------------------------------------------------------

  function renderIntro() {
    clear();
    var n = steps.length;
    var mins = meta.minutes ? meta.minutes + " minutes" : "a few minutes";
    var c = criterion();
    var card = el("section", { class: "card" }, [
      el("ul", { class: "facts" }, [
        el("li", { text: n + (n === 1 ? " question" : " questions") + ", about " + mins + "." }),
        el("li", { text: "Nothing is revealed until you answer. Retrieving first is the part that works." }),
        c.text ? el("li", { text: "Done means: " + c.text }) : null
      ]),
      el("div", { class: "btn-row" }, [
        el("button", { class: "btn btn-primary", type: "button", text: "Start", onclick: function () { startRound(); } })
      ])
    ]);
    app.appendChild(card);
  }

  // ---- question -------------------------------------------------------

  function startRound() {
    screen = "question";
    round = 1;
    queue = steps.map(function (_, i) { return i; });
    pos = 0;
    render();
  }

  function startMissedRound(indices) {
    screen = "question";
    round += 1;
    queue = indices.slice();
    pos = 0;
    render();
  }

  function render() {
    if (!steps.length) {
      clear();
      app.appendChild(el("section", { class: "card" }, [
        el("p", { class: "prompt", text: "This exercise has no steps yet." }),
        el("p", { text: "The JSON spec in this page is empty or malformed." })
      ]));
      return;
    }
    if (screen === "intro") return renderIntro();
    if (screen === "question") return renderQuestion();
    return renderResults();
  }

  function renderQuestion() {
    clear();
    var i = queue[pos];
    var step = steps[i];
    var first = round === 1;
    var label = (first ? "Question " : "Revisit ") + (pos + 1) + " of " + queue.length;
    var p = progressBar(label);

    var card = el("section", { class: "card" });
    card.appendChild(p.node);
    if (step.tag) card.appendChild(el("span", { class: "tag", text: step.tag }));
    card.appendChild(el("h2", { class: "prompt", text: step.prompt }));

    var body;
    if (step.kind === "choice" && Array.isArray(step.options)) {
      body = renderChoice(step, i, p, card);
    } else {
      body = renderShort(step, i, p, card);
    }
    card.appendChild(body);

    if (step.hint && first) {
      var hintBox = el("p", { class: "hint", text: step.hint, style: "display:none" });
      var hintBtn = el("button", {
        class: "btn btn-quiet hint-btn", type: "button", text: "Show a hint",
        onclick: function () { hintBox.style.display = ""; hintBtn.remove(); }
      });
      card.appendChild(hintBtn);
      card.appendChild(hintBox);
    }

    app.appendChild(card);
  }

  function renderChoice(step, i, p, card) {
    var list = el("div", { class: "opts" });
    step.options.forEach(function (text, idx) {
      var btn = el("button", { class: "opt", type: "button" }, [
        el("span", { class: "opt-key", text: String.fromCharCode(65 + idx) }),
        el("span", { class: "opt-text", text: text })
      ]);
      btn.addEventListener("click", function () { submit(i, idx, p, card, list); });
      list.appendChild(btn);
    });
    return list;
  }

  function renderShort(step, i, p, card) {
    var form = el("form", { class: "short", novalidate: true });
    var input = el("input", {
      class: "inp", id: "answer-input", type: "text", name: "answer",
      autocomplete: "off", autocapitalize: "off", autocorrect: "off", spellcheck: "false",
      placeholder: "Type your answer", "aria-label": "Your answer"
    });
    form.appendChild(el("label", { class: "lbl", for: "answer-input", text: "Your answer, from memory" }));
    form.appendChild(input);
    form.appendChild(el("button", { class: "btn btn-primary", type: "submit", text: "Check answer" }));
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      submit(i, input.value, p, card, form);
    });
    return form;
  }

  function submit(stepIndex, given, p, card, control) {
    var step = steps[stepIndex];
    var ok = isCorrect(step, given);
    latest.set(stepIndex, ok);

    // lock the interaction and mark the options
    var options = control.querySelectorAll ? control.querySelectorAll(".opt") : [];
    Array.prototype.forEach.call(options, function (btn, idx) {
      btn.disabled = true;
      var right = step.kind === "choice" && (typeof step.answer === "number" ? idx === step.answer : norm(step.options[idx]) === norm(step.answer));
      if (right) {
        btn.setAttribute("data-state", "right");
        btn.appendChild(el("span", { class: "opt-mark", text: "Correct answer" }));
      } else if (idx === given) {
        btn.setAttribute("data-state", "wrong");
        btn.appendChild(el("span", { class: "opt-mark", text: "Your answer" }));
      } else {
        btn.setAttribute("data-state", "muted");
      }
    });
    if (step.kind !== "choice") {
      var input = control.querySelector ? control.querySelector("input") : null;
      if (input) { input.readOnly = true; input.value = given; }
      var btn = control.querySelector ? control.querySelector("button") : null;
      if (btn) btn.remove();
    }

    p.fill.style.width = ((pos + 1) / p.n) * 100 + "%";
    p.bar.setAttribute("aria-valuenow", String(pos + 1));

    // A hint has done its job once the question is answered.
    var hintBtn = card.querySelector(".hint-btn");
    if (hintBtn) hintBtn.remove();
    var hintBox = card.querySelector(".hint");
    if (hintBox) hintBox.remove();

    var box = feedback(step, ok, given);
    card.appendChild(box);

    var last = pos === queue.length - 1;
    var next = el("div", { class: "btn-row" }, [
      el("button", {
        class: "btn btn-primary", type: "button",
        text: last ? "See results" : "Next question",
        onclick: function () {
          if (last) { screen = "results"; render(); }
          else { pos += 1; render(); }
        }
      })
    ]);
    card.appendChild(next);
    box.focus();
  }

  function feedback(step, ok, given) {
    var box = el("div", { class: "fb " + (ok ? "fb-ok" : "fb-no"), role: "status", tabindex: "-1" });
    box.appendChild(el("p", {
      class: "fb-verdict",
      text: ok ? "Correct" : "Not yet"
    }));
    if (!ok) {
      box.appendChild(el("p", { class: "fb-answer" }, [
        document.createTextNode("Right answer: "),
        el("code", { text: modelAnswer(step) })
      ]));
    }
    if (step.feedback) box.appendChild(el("p", { class: "fb-why", text: step.feedback }));
    var mis = ok ? "" : misconceptionFor(step, step.kind === "choice" ? given : "default");
    if (mis) box.appendChild(el("p", { class: "fb-mis", text: "Watch out: " + mis }));
    return box;
  }

  // ---- results --------------------------------------------------------

  function renderResults() {
    clear();
    var c = criterion();
    var right = queue.filter(function (i) { return latest.get(i) === true; }).length;
    var missed = queue.filter(function (i) { return latest.get(i) !== true; });
    var overall = steps.reduce(function (n, _, i) { return n + (latest.get(i) === true ? 1 : 0); }, 0);
    var firstPass = round === 1;
    var met = overall >= c.minCorrect;

    var card = el("section", { class: "card" });
    card.appendChild(el("p", { class: "score", text: right + " of " + queue.length }));
    card.appendChild(el("p", {
      text: firstPass
        ? (right === queue.length ? "Every question right on the first pass." : "Right on the first pass, out of " + queue.length + ".")
        : "Right this round. " + overall + " of " + steps.length + " overall."
    }));

    if (c.text) {
      card.appendChild(el("p", { class: "spacing" }, [
        el("span", { class: "verdict-" + (met ? "met" : "not"), text: met ? "Criterion met. " : "Not met yet. " }),
        document.createTextNode(c.text)
      ]));
    }

    if (missed.length) {
      var list = el("ul", { class: "res-list" });
      missed.forEach(function (i) {
        var step = steps[i];
        list.appendChild(el("li", {}, [
          el("p", { class: "q", text: step.prompt }),
          el("p", { class: "a", text: "Answer: " + modelAnswer(step) }),
          step.feedback ? el("p", { class: "a", text: step.feedback }) : null
        ]));
      });
      card.appendChild(el("h2", { class: "prompt", style: "margin-top:var(--space-6);font-size:var(--text-lg)", text: "Still to learn" }));
      card.appendChild(list);
    }

    var buttons = [];
    if (missed.length) {
      buttons.push(el("button", {
        class: "btn btn-primary", type: "button",
        text: "Redo the " + missed.length + " you missed",
        onclick: function () { startMissedRound(missed); }
      }));
    }
    buttons.push(el("button", {
      class: missed.length ? "btn btn-quiet" : "btn btn-primary",
      type: "button",
      text: "Start over",
      onclick: function () { latest.clear(); startRound(); }
    }));
    card.appendChild(el("div", { class: "btn-row" }, buttons));

    card.appendChild(el("p", {
      class: "spacing",
      text: missed.length
        ? "Do these " + missed.length + " again tomorrow, not in ten minutes. The gap is what makes them stick."
        : "Come back to this in a day or two and run it again. Spacing the same questions over days is what makes them stay."
    }));

    app.appendChild(card);
    var first = card.querySelector("button");
    if (first) first.focus();
  }

  render();
})();
</script>
</body>
</html>
